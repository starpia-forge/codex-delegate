name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm.cmd ci
      - name: Publish the Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node_modules/.bin/semantic-release.cmd
      - uses: actions/upload-artifact@v4
        if: ${{ failure() || cancelled() }}
        with:
          name: release-bundle
          path: |
            dist/codex-delegate-pet-windows-x64.zip
            dist/codex-delegate-pet-windows-x64.zip.sha256
          if-no-files-found: ignore
