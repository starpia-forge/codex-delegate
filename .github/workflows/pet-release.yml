name: Pet release

on:
  push:
    tags: ['pet-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PET_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the shipped package
        run: npm.cmd test
      - name: Build the pet app
        run: |
          if ($env:PET_RELEASE_TAG -notmatch '^pet-v\d+\.\d+\.\d+$') { throw 'Expected pet-vX.Y.Z' }
          $env:CODEX_DELEGATE_PET_VERSION = $env:PET_RELEASE_TAG.Substring(5)
          cargo build --release --locked --manifest-path pet/app/src-tauri/Cargo.toml
      - name: Package the pet bundle
        run: node scripts/pet-bundle.mjs --tag "$env:PET_RELEASE_TAG" --out dist
      - name: Publish the pet release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:PET_RELEASE_TAG"
          dist/codex-delegate-pet-windows-x64.zip
          dist/codex-delegate-pet-windows-x64.zip.sha256
          --verify-tag --title "$env:PET_RELEASE_TAG" --generate-notes
      - name: Show the package pin
        run: |
          @(
            'Copy this JSON into pet-pin.json in a normal commit after verifying the release.'
            ''
            '```json'
            (Get-Content dist/pet-pin.json -Raw)
            '```'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
