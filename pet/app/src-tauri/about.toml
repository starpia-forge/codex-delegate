# Priority order: elect a notice-free alternative before a notice-bearing one.
accepted = [
  "0BSD", "MIT-0", "Unlicense", "CC0-1.0", "Zlib", "WTFPL", "BSL-1.0",
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0",
]

# Reviewed clarifications
# Checksums bind reviewed files to the versions below. Review on lockfile updates;
# cargo-about only warns on a mismatch, so pet-notices also rejects generic fallback.

# Elect BSD-3-Clause: only the BSD-3-Clause text ships with this crate.

